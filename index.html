<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convertidor Ecuaplus - SRI a Excel</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4"
  >
    <div
      class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden"
    >
      <!-- Header -->
      <div
        class="bg-gradient-to-r from-ecuaplus-darkblue to-ecuaplus-blue p-8 text-center"
      >
        <h1 class="text-3xl font-bold text-white mb-2">
          Convertidor de Comprobantes
        </h1>
        <p class="text-blue-100">
          Procesa tus archivos TXT del SRI y expórtalos a Excel
        </p>
      </div>

      <!-- Main Content -->
      <div class="p-8">
        <!-- Drop Zone -->
        <div
          id="drop-zone"
          class="border-4 border-dashed border-slate-200 rounded-xl p-12 text-center transition-all duration-300 ease-in-out cursor-pointer hover:border-ecuaplus-blue group"
        >
          <div class="mb-4">
            <svg
              class="w-16 h-16 mx-auto text-slate-300 group-hover:text-ecuaplus-blue transition-colors"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
              ></path>
            </svg>
          </div>

          <h3 class="text-xl font-semibold text-slate-700 mb-2">
            Arrastra tu archivo aquí
          </h3>
          <p class="text-slate-500 mb-6">
            o haz clic para seleccionar (Formato .txt)
          </p>

          <input type="file" id="file-input" accept=".txt" class="hidden" />
          <button
            onclick="document.getElementById('file-input').click()"
            class="bg-ecuaplus-orange hover:bg-orange-600 text-white font-semibold py-2 px-6 rounded-full transition-colors shadow-md hover:shadow-lg"
          >
            Seleccionar Archivo
          </button>
        </div>

        <!-- Status Area -->
        <div id="status-area" class="mt-6 hidden">
          <div
            class="flex items-center justify-center p-4 rounded-lg bg-blue-50 text-blue-800"
          >
            <svg
              class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-800"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Procesando archivo...
          </div>
        </div>

        <!-- Error Area -->
        <div id="error-area" class="mt-6 hidden"></div>
      </div>

      <!-- Footer -->
      <div
        class="bg-slate-50 px-8 py-4 border-t border-slate-100 flex justify-between items-center text-sm text-slate-400"
      >
        <span>Powered by Ecuaplus Logic</span>
        <span>v1.0.0 Serverless</span>
      </div>
    </div>

    <!-- Application Script -->
    <script src="script.js"></script>
  </body>
</html>
